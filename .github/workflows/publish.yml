name: Publish to Modrinth + CurseForge

on:
  release:
    types: [published]
  # Manual per-store publishing: pick the store and the release tag whose jars/changelog
  # to publish. Lets one store go live while the other is still awaiting approval.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Store(s) to publish to'
        type: choice
        options: [both, curseforge, modrinth]
        default: both
        required: true
      tag:
        description: 'Release tag whose body is the store changelog (e.g. v1.2.0-26.2)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The "publish" environment holds the store tokens and requires manual approval
    # (required reviewer) before this job can run. Configure it in repo Settings.
    environment: publish
    steps:
      # Dispatch builds from the SELECTED BRANCH ("Use workflow from"), not from the tag:
      # release tags may predate a project-ID retrofit (gradle.properties TBD -> dry-run).
      # The tag input only supplies the changelog. Release events still build the tag itself.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Load changelog from the release body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          {
            echo 'CHANGELOG<<CHANGELOG_EOF'
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              gh release view "${{ inputs.tag }}" --json body -q .body
            else
              printf '%s\n' "$RELEASE_BODY"
            fi
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_ENV"
      - name: Publish mod files
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          PLATFORM="${{ inputs.platform || 'both' }}"
          case "$PLATFORM" in
            curseforge) TASKS="publishCurseforgeFabric publishCurseforgeNeoforge" ;;
            modrinth)   TASKS="publishModrinthFabric publishModrinthNeoforge" ;;
            *)          TASKS="publishMods" ;;
          esac
          chmod +x ./gradlew && ./gradlew $TASKS -PpublishPlatform="$PLATFORM"
