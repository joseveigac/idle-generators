plugins {
    // MC 26.x ships unobfuscated: the no-remap Loom variant replaces dev.architectury.loom
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.2' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Suffixed jar names, e.g. `idlegenerators-26.2-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }
        maven {
            name = 'shedaniel'
            url = 'https://maven.shedaniel.me/' // Cloth Config
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/' // ModMenu
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven' // dev-only runtime mods (Iris/Sodium for the photo client)
                }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    dependencies {
        // No mappings dependency: the 26.x game jar already has official names.
        minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
            // No publish repositories: private project.
        }
    }
}

// Store publishing (Modrinth + CurseForge). Runs from GitHub Actions on release,
// gated behind the "publish" environment; without tokens or real project IDs it dry-runs.
// Subprojects must be evaluated first so their shadowJar tasks exist.
evaluationDependsOnChildren()

// Per-store readiness: a store only publishes for real when it has BOTH its token and a
// real project ID. -PpublishPlatform=curseforge|modrinth (set by the workflow_dispatch in
// publish.yml, which also restricts the Gradle tasks to that store) allows publishing to
// one store while the other is still unapproved. Default 'both' keeps the old safety:
// anything missing -> everything dry-runs.
def modrinthNotReady = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null \
        || modrinth_project_id == 'TBD'
def curseforgeNotReady = providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null \
        || curseforge_project_id == 'TBD'
def publishPlatform = providers.gradleProperty('publishPlatform').getOrElse('both')

publishMods {
    changelog = providers.environmentVariable('CHANGELOG')
            .getOrElse('See the GitHub release for the full changelog.')
    type = STABLE
    dryRun = publishPlatform == 'curseforge' ? curseforgeNotReady
            : publishPlatform == 'modrinth' ? modrinthNotReady
            : (modrinthNotReady || curseforgeNotReady)

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinth_project_id
        minecraftVersions.add(minecraft_version)
    }
    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforge_project_id
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        javaVersions.add(JavaVersion.VERSION_25)
        changelogType = 'markdown'
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file = project(':fabric').tasks.shadowJar.archiveFile
        displayName = "Idle Generators ${mod_version} (Fabric ${minecraft_version})"
        modLoaders.add('fabric')
        requires { slug = 'architectury-api' }
        requires { slug = 'cloth-config' }
        requires { slug = 'fabric-api' }
        optional { slug = 'jade' }
    }
    modrinth('modrinthNeoforge') {
        from mrOptions
        file = project(':neoforge').tasks.shadowJar.archiveFile
        displayName = "Idle Generators ${mod_version} (NeoForge ${minecraft_version})"
        modLoaders.add('neoforge')
        requires { slug = 'architectury-api' }
        requires { slug = 'cloth-config' }
        optional { slug = 'jade' }
    }
    curseforge('curseforgeFabric') {
        from cfOptions
        file = project(':fabric').tasks.shadowJar.archiveFile
        displayName = "Idle Generators ${mod_version} (Fabric ${minecraft_version})"
        modLoaders.add('fabric')
        requires('architectury-api', 'cloth-config', 'fabric-api')
        optional('jade')
    }
    curseforge('curseforgeNeoforge') {
        from cfOptions
        file = project(':neoforge').tasks.shadowJar.archiveFile
        displayName = "Idle Generators ${mod_version} (NeoForge ${minecraft_version})"
        modLoaders.add('neoforge')
        requires('architectury-api', 'cloth-config')
        optional('jade')
    }
}
