plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
    // 1.1.0 is the last version supporting Gradle 8.x (2.x needs Gradle 9)
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
        maven {
            name = 'shedaniel'
            url = 'https://maven.shedaniel.me/' // Cloth Config
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/' // ModMenu
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven' // dev-only runtime mods (Iris/Sodium for the photo client)
                }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

// Store publishing (Modrinth + CurseForge). Runs from GitHub Actions on release,
// gated behind the "publish" environment; without tokens or real project IDs it dry-runs.
// Subprojects must be evaluated first so their remapJar tasks exist.
evaluationDependsOnChildren()

publishMods {
    changelog = providers.environmentVariable('CHANGELOG')
            .getOrElse('See the GitHub release for the full changelog.')
    type = STABLE
    dryRun = providers.environmentVariable('MODRINTH_TOKEN').getOrNull() == null \
            || providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null \
            || modrinth_project_id == 'TBD' || curseforge_project_id == 'TBD'

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinth_project_id
        minecraftVersions.add(minecraft_version)
    }
    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforge_project_id
        minecraftVersions.add(minecraft_version)
        clientRequired = true
        serverRequired = true
        javaVersions.add(JavaVersion.VERSION_21)
        changelogType = 'markdown'
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file = project(':fabric').tasks.remapJar.archiveFile
        displayName = "Idle Generators ${mod_version} (Fabric ${minecraft_version})"
        modLoaders.add('fabric')
        requires { slug = 'architectury-api' }
        requires { slug = 'cloth-config' }
        requires { slug = 'fabric-api' }
        optional { slug = 'jade' }
    }
    modrinth('modrinthNeoforge') {
        from mrOptions
        file = project(':neoforge').tasks.remapJar.archiveFile
        displayName = "Idle Generators ${mod_version} (NeoForge ${minecraft_version})"
        modLoaders.add('neoforge')
        requires { slug = 'architectury-api' }
        requires { slug = 'cloth-config' }
        optional { slug = 'jade' }
    }
    curseforge('curseforgeFabric') {
        from cfOptions
        file = project(':fabric').tasks.remapJar.archiveFile
        displayName = "Idle Generators ${mod_version} (Fabric ${minecraft_version})"
        modLoaders.add('fabric')
        requires('architectury-api', 'cloth-config', 'fabric-api')
        optional('jade')
    }
    curseforge('curseforgeNeoforge') {
        from cfOptions
        file = project(':neoforge').tasks.remapJar.archiveFile
        displayName = "Idle Generators ${mod_version} (NeoForge ${minecraft_version})"
        modLoaders.add('neoforge')
        requires('architectury-api', 'cloth-config')
        optional('jade')
    }
}
