plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def datagenOutputDir = rootProject.file('common/src/main/generated').absolutePath

loom {
    runs {
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            runDir 'build/gametest'
        }
        datagen {
            server()
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${datagenOutputDir}"
            vmArg '-Dfabric-api.datagen.modid=idlegenerators'
            runDir 'build/datagen'
        }
        photoClient {
            client()
            name 'Photo Client (shaders)'
            runDir 'run-photo' // own worlds/config/shaderpacks — the normal client stays untouched
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config — required at runtime for the config system.
    implementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    // ModMenu — optional; gives the Mods list + config button on Fabric. Dev runtime only.
    compileOnly("com.terraformersmc:modmenu:$rootProject.modmenu_version") { transitive = false }
    localRuntime("com.terraformersmc:modmenu:$rootProject.modmenu_version") { transitive = false }

    // Jade — integración opcional (tooltip al mirar un generador). Dev runtime only.
    compileOnly "maven.modrinth:jade:$rootProject.jade_fabric_version"
    localRuntime "maven.modrinth:jade:$rootProject.jade_fabric_version"

    // Iris + Sodium — dev-only, for the Photo Client run (screenshots with shaders). NEVER shipped.
    // Iris 1.11.2 requires Sodium 0.9.1 (verified from changelog, 2026-07-11).
    // Pinned 2026-07-11 via Modrinth API (both published 2026-07-08).
    localRuntime 'maven.modrinth:sodium:mc26.2-0.9.1-fabric'
    localRuntime 'maven.modrinth:iris:1.11.2+26.2-fabric'
    // Iris ships these nested in its production jar, but nested libs don't load in the
    // Architectury dev runtime (Modrinth maven has no transitives) — add them explicitly.
    // glsl-transformer 3.0.0-pre3 verified against Iris 1.11.x for 26.2 (porting.md 2026-07).
    localRuntime 'org.anarres:jcpp:1.4.14'
    localRuntime 'io.github.douira:glsl-transformer:3.0.0-pre3'
    localRuntime 'org.antlr:antlr4-runtime:4.13.1'

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}
