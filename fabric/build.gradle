plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

def datagenOutputDir = rootProject.file('common/src/main/generated').absolutePath

loom {
    runs {
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            runDir 'build/gametest'
        }
        datagen {
            server()
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${datagenOutputDir}"
            vmArg '-Dfabric-api.datagen.modid=idlegenerators'
            runDir 'build/datagen'
        }
        photoClient {
            client()
            name 'Photo Client (shaders)'
            runDir 'run-photo' // own worlds/config/shaderpacks — the normal client stays untouched
        }
    }
}

// v1.3.0 R4: el datagen de Fabric produce las recetas que comparten ambos loaders, así que las
// condiciones de carga se inyectan sobre su salida, con LAS DOS claves en el mismo JSON. Está
// verificado empíricamente (probe 2026-08-02) que cada loader ignora la clave del otro sin
// quejarse, y las claves y discriminadores salen de javap sobre los jars (spike S2, 2026-08-04):
//   Fabric   → "fabric:load_conditions", discriminador "condition"  (ResourceConditions.CONDITIONS_KEY)
//   NeoForge → "neoforge:conditions",    discriminador "type"       (literal en ICondition)
//
// Es una TASK APARTE y no un doLast de runDatagen a propósito: en esta máquina runDatagen escribe
// sus salidas y luego NO sale (TransformerRuntime colgado, ver porting.md §"runDatagen may not
// exit"), así que hay que matarlo a mano y ningún doLast/finalizedBy suyo llegaría a ejecutarse.
// Flujo: runDatagen → (matar el JVM colgado si hace falta) → injectLoadConditions.
// Es idempotente: reinyecta sobre lo ya inyectado sin duplicar.
tasks.register('injectLoadConditions') {
    group = 'idlegenerators'
    description = 'Inyecta las condiciones de carga (Fabric + NeoForge) en las recetas generadas'
    outputs.upToDateWhen { false } // barato y idempotente; nunca conviene saltárselo
    doLast {
        def genRoot = file(datagenOutputDir)
        def targets = [
            new File(genRoot, 'data/idlegenerators/recipe'),
            new File(genRoot, 'data/idlegenerators/advancement/recipes/decorations')
        ]
        targets.each { dir ->
            if (!dir.isDirectory()) throw new GradleException("injectLoadConditions: no existe ${dir}")
            def total = 0, patched = 0
            dir.eachFileMatch(~/.*_generator\.json/) { f ->
                total++
                def key = f.name - '_generator.json'
                def json = new groovy.json.JsonSlurper().parse(f)
                json['neoforge:conditions'] = [[type: 'idlegenerators:generator_enabled', generator: key]]
                json['fabric:load_conditions'] = [[condition: 'idlegenerators:generator_enabled', generator: key]]
                f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
                patched++
            }
            // Gate: cada fichero *_generator.json de la carpeta tiene que quedar con las dos claves.
            if (total == 0) throw new GradleException("injectLoadConditions: 0 ficheros en ${dir.name}")
            if (total != patched) throw new GradleException("injectLoadConditions: ${patched}/${total} en ${dir.name}")
            logger.lifecycle("injectLoadConditions: ${patched}/${total} en ${dir.name}")
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Cloth Config — required at runtime for the config system.
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    // ModMenu — optional; gives the Mods list + config button on Fabric. Dev runtime only.
    // Resolved from the Modrinth maven: maven.terraformersmc.com served corrupt jars (2026-07-20).
    modCompileOnly "maven.modrinth:modmenu:$rootProject.modmenu_version"
    modLocalRuntime "maven.modrinth:modmenu:$rootProject.modmenu_version"

    // Jade — integración opcional (tooltip al mirar un generador). Dev runtime only.
    modCompileOnly "maven.modrinth:jade:$rootProject.jade_fabric_version"
    modLocalRuntime "maven.modrinth:jade:$rootProject.jade_fabric_version"

    // EMI — dev runtime only, para verificar en cliente que un generador desactivado desaparece
    // de su lista de items (v1.3.0 R4). Solo en esta rama: EMI no existe para 26.x (2026-08-04).
    modLocalRuntime 'maven.modrinth:emi:1.1.24+1.21.1+fabric'

    // Iris + Sodium — dev-only, for the Photo Client run (screenshots with shaders). NEVER shipped.
    // Iris 1.8.8 requires Sodium 0.6.x (verified from its fabric.mod.json, 2026-07).
    modLocalRuntime 'maven.modrinth:sodium:mc1.21.1-0.6.13-fabric'
    modLocalRuntime 'maven.modrinth:iris:1.8.8+1.21.1-fabric'
    // Iris ships these nested in its production jar, but nested libs don't load in the
    // Architectury dev runtime (Modrinth maven has no transitives) — add them explicitly.
    localRuntime 'org.anarres:jcpp:1.4.14'
    localRuntime 'io.github.douira:glsl-transformer:2.0.1'
    localRuntime 'org.antlr:antlr4-runtime:4.13.1'

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
